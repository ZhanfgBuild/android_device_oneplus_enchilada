name: AOSP 17 source preflight

on:
  push:
    branches:
      - bringup/aosp17
      - 'work/aosp17-*'
  pull_request:
    branches:
      - bringup/aosp17
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage0-static:
    name: Lockfile and product static checks (NOT a ROM build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate local manifest and AOSP product
        run: |
          python3 -m py_compile tools/validate_aosp17.py tests/test_aosp17_preflight.py
          python3 tools/validate_aosp17.py
      - name: Run negative-case and pinning tests
        run: python3 -m unittest discover -s tests -p 'test_aosp17_preflight.py' -v
